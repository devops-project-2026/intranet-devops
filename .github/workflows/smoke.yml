name: Docker smoke test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docker-smoke-test:
    name: Build and verify Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application images
        run: docker compose build

      - name: Start application stack
        run: docker compose up -d

      - name: Apply database migrations
        run: docker compose exec -T backend php bin/console doctrine:migrations:migrate --no-interaction

      - name: Verify frontend response
        run: curl --fail --retry 10 --retry-delay 3 http://localhost:3000

      - name: Verify backend container
        run: docker compose exec -T backend php bin/console about

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose down -v --remove-orphans
